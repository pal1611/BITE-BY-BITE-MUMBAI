<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - Bite by Bite</title>

<style>


body{
background:#fff8f0;
font-family:Arial;
margin:0;
}

header{
background:#fff1b5;
padding:15px 40px;
display:flex;
justify-content:space-between;
}

header h1{
color:#634b49;
}

nav a{
margin-left:20px;
text-decoration:none;
color:#634b49;
font-weight:bold;
}

.register-container{
display:flex;
justify-content:center;
align-items:center;
height:80vh;
}

.register-box{
background:white;
padding:40px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
width:320px;
}

.register-box h2{
text-align:center;
color:#634b49;
margin-bottom:20px;
}

input{
width:100%;
padding:10px;
margin-bottom:15px;
border-radius:5px;
border:1px solid #ccc;
}

button{
width:100%;
padding:10px;
background:#fff1b5;
border:none;
border-radius:5px;
font-weight:bold;
color:#634b49;
cursor:pointer;
}

button:hover{
background-color:#c1dbe8;
}

</style>
</head>
<body>

<header>
<h1>Bite by Bite</h1>

<nav>
<a href="index.html">Home</a>
<a href="trails.html">Trails</a>
<a href="login.html">Login</a>
<a href="register.html">Register</a>

</nav>

</header>

<div class="register-container">

<div class="register-box">

<h2>Create Account</h2>

<form>

<input type = "text" placeholder = "Phone Number">

<input type="text" placeholder="Full Name">

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<input type="password" placeholder="Confirm Password">

<p id="ErrorMessage" style="color:red; font-size:14px;"></p>

<button type="submit">Register</button>

</form>

</div>

</div>

<script>
document.querySelector("form").addEventListener("submit", function(e){
    e.preventDefault();

    document.getElementById("ErrorMessage").innerText = "";

    let inputs = document.querySelectorAll("input");

    let phone = inputs[0].value.trim();
    let name = inputs[1].value.trim();
    let email = inputs[2].value.trim();
    let password = inputs[3].value;
    let confirm = inputs[4].value;


    if(!phone || !name || !email || !password || !confirm)
    {
        document.getElementById("ErrorMessage").innerText = "All fields are required!";
    return;
    }

    if(password !== confirm)
    {
        document.getElementById("ErrorMessage").innerText = "Passwords do not match!";
    return;
    }


    if(!/^\d{10}$/.test(phone))
    {
    document.getElementById("ErrorMessage").innerText = "Please enter valid 10-digit phone number";
    return;
    }

    if(!/^[a-zA-Z ]+$/.test(name))
    {
    document.getElementById("ErrorMessage").innerText = "Name should contain only letters";
    return;
    }

    if(!/^\S+@\S+\.\S+$/.test(email))
    {
        document.getElementById("ErrorMessage").innerText = "Please enter valid email";
        return;
}   

    if(password.length < 6)
    {
        document.getElementById("ErrorMessage").innerText = "Password must be at least 6 characters";
        return;
    }

        if(localStorage.getItem(email))
        {
            document.getElementById("ErrorMessage").innerText = "User already exists!";
            return;
        }

        let user = {
            phone, name, email, password, role: "user"
        };

        localStorage.setItem(email, JSON.stringify(user));

    alert("Registration successful!");
    window.location.href = "login.html";
});
</script>

</body>
</html>
