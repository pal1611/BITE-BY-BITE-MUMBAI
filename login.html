<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Bite by Bite</title>

<style>

button:hover {
    background-color: #c1dbe8;
}

body{
background:#fff8f0;
font-family:Arial;
margin:0;
}

header{
background:#fff1b5;
padding:15px 40px;
display:flex;
justify-content:space-between;
}

header h1{
color:#634b49;
}

nav a{
margin-left:20px;
text-decoration:none;
color:#634b49;
font-weight:bold;
}

.login-container{
display:flex;
justify-content:center;
align-items:center;
height:80vh;
}

.login-box{
background:white;
padding:40px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
width:300px;
}

.login-box h2{
text-align:center;
color:#634b49;
margin-bottom:20px;
}

input{
width:100%;
padding:10px;
margin-bottom:15px;
border-radius:5px;
border:1px solid #ccc;
}

button{
width:100%;
padding:10px;
background:#fff1b5;
border:none;
border-radius:5px;
font-weight:bold;
color:#634b49;
cursor:pointer;
}

</style>
</head>

<body>

<header>
<h1>Bite by Bite</h1>
<nav>
<a href="index.html">Home</a>
<a href="trails.html">Trails</a>
<a href="login.html">Login</a>
<a href="register.html">Register</a>

</nav>
</header>

<div class="login-container">

<div class="login-box">

<h2>Login</h2>

<form>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<p id="errorMsg" style="color:red; font-size:14px;"></p>

<button type="submit">Login</button>

</form>

</div>

</div>

<script>
if(!localStorage.getItem("admin@bbb.com")){
    localStorage.setItem("admin@bbb.com", JSON.stringify({
        name: "Admin",
        email: "admin@bbb.com",
        password: "admin123",
        role: "admin"
    }));
}

document.querySelector("form").addEventListener("submit", function(e){
    e.preventDefault();
    document.getElementById("errorMsg").innerText = "";

    let email = document.querySelectorAll("input")[0].value.trim();
    let password = document.querySelectorAll("input")[1].value;

    let user = JSON.parse(localStorage.getItem(email));

    if(user && user.password === password){
        sessionStorage.setItem("user", JSON.stringify(user));

        if(user.role === "admin"){
            window.location.href = "admin.html";
        } else {
            window.location.href = "index.html";
        }
    } else {
        document.getElementById("errorMsg").innerText = "Invalid email or password";
    }
});
</script>

</body>
</html>
