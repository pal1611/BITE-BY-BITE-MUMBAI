<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<style>
body{
    font-family: Arial;
    background:#fff8f0;
    padding:20px;
}

input{
    padding:10px;
    margin:10px 0;
}

button{
    padding:10px;
    background:#fff1b5;
    border:none;
    border-radius:5px;
    color:#634b49;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#c1dbe8;
}

.box{
    background:white;
    padding:10px;
    margin:10px 0;
}
</style>
</head>

<body>

<h2>Admin Panel</h2>

<a href="index.html">Go to Home</a>
<button onclick="logout()">Logout</button>

<h3>Add New Trail</h3>

<input type="text" id="trailName" placeholder="Trail name">
<button onclick="addTrail()">Add Trail</button>

<h3>All Trails</h3>

<div id="trailList"></div>

<script>

let user = JSON.parse(sessionStorage.getItem("user"));

if(!user || user.role !== "admin"){
    alert("Access denied");
    window.location.href = "login.html";
}


function logout(){
    sessionStorage.removeItem("user");
    window.location.href = "login.html";
}


function addTrail(){
    let name = document.getElementById("trailName").value.trim();

    if(!name){
        alert("Enter trail name");
        return;
    }

    let trails = JSON.parse(localStorage.getItem("trails")) || [];

    trails.push({name});

    localStorage.setItem("trails", JSON.stringify(trails));

    document.getElementById("trailName").value = "";

    displayTrails();
}


function displayTrails(){
    let trails = JSON.parse(localStorage.getItem("trails")) || [];

    let container = document.getElementById("trailList");

    container.innerHTML = "";

    trails.forEach((t, index) => {
        container.innerHTML += `
            <div class="box">
                ${t.name}
                <button onclick="deleteTrail(${index})">Delete</button>
            </div>
        `;
    });
}


function deleteTrail(index){
    let trails = JSON.parse(localStorage.getItem("trails"));

    trails.splice(index,1);

    localStorage.setItem("trails", JSON.stringify(trails));

    displayTrails();
}

displayTrails();

</script>

</body>
</html>
